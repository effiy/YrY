<div class="page page-sessions">
  <filter-bar
    :query="store.sessionQuery"
    query-placeholder="搜索会话标题 / URL / 标签"
    :selected-date="store.selectedDate"
    :sort-key="store.sessionFilter.sortBy"
    :all-tags="store.allSessionTags"
    :selected-tags="store.sessionFilter.selectedTags"
    @update:query="store.sessionQuery = $event"
    @update:selected-date="store.selectedDate = $event"
    @prev-day="store.selectedDate = shiftISODate(store.selectedDate, -1)"
    @next-day="store.selectedDate = shiftISODate(store.selectedDate, 1)"
    @toggle-sort="store.toggleSessionSort()"
    @toggle-tag="store.toggleSessionTag($event)"
  />

  <van-pull-refresh v-model="refreshing" @refresh="onRefresh">
    <div class="session-list" v-if="!store.sessionsLoading && filtered.length">
      <van-swipe-cell
        v-for="item in filtered"
        :key="item.key"
        :right-width="120"
      >
        <div class="session-item" @click="goChat(item)">
          <div class="session-item__header">
            <h3 class="session-item__title">{{ item.pageTitle || item.title || '未命名' }}</h3>
            <van-icon v-if="item.isFavorite" name="star" color="#ff976a" size="16" />
          </div>
          <p class="session-item__url" v-if="item.url">{{ item.url }}</p>
          <p class="session-item__preview" v-if="item.preview">{{ item.preview }}</p>
          <div class="session-item__footer">
            <span class="session-item__count" v-if="item.messageCount">{{ item.messageCount }} 条消息</span>
            <span class="session-item__time">{{ formatTime(item.updatedAt) }}</span>
          </div>
        </div>
        <template #right>
          <van-button square type="danger" text="删除" @click="onDelete(item)" />
        </template>
      </van-swipe-cell>
    </div>
    <van-empty v-else-if="!store.sessionsLoading" description="暂无会话" />
  </van-pull-refresh>

  <van-loading v-if="store.sessionsLoading" class="loading-center" />
</div>
