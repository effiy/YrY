<div class="rui-scene-card" role="article" aria-label="Scene card">
  <div class="rui-scene-card-body">
    <div class="rui-scene-card-name">
      <a v-if="nameHref" :href="nameHref" :target="nameTarget || null" :rel="nameTarget ? 'noopener noreferrer' : null">{{ name }}</a>
      <span v-else>{{ name }}</span>
      <span v-if="badge" class="rui-badge rui-badge--sm fail" role="status">{{ badge }}</span>
    </div>
    <div v-if="desc" class="rui-scene-card-desc" v-html="desc"></div>
    <div v-if="tags && tags.length" class="rui-scene-card-tags">
      <rui-tag-chip
        v-for="t in tags" :key="t.text"
        :text="t.text"
        :modifier="t.modifier || 'info'"
        :href="t.href || ''" />
    </div>
    <div v-if="meta" class="rui-scene-card-meta">{{ meta }}</div>
    <div v-if="resolvedLinks && resolvedLinks.length" class="rui-scene-card-links">
        <template v-for="(l, idx) in resolvedLinks" :key="(l.label || l.href || 'link') + '-' + idx">
            <a v-if="l.href" :href="l.href" target="_blank" rel="noopener noreferrer">{{ l.label }}</a>
            <span v-else>{{ l.label }}</span>
        </template>
    </div>
  </div>
</div>
