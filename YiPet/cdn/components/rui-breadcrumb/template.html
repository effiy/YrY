<nav class="rui-breadcrumb" :aria-label="ariaLabel">
    <template v-for="(item, idx) in items">
        <a v-if="item.href && idx < items.length - 1" :href="item.href">{{ item.label }}</a>
        <span v-else-if="!item.href && idx < items.length - 1">{{ item.label }}</span>
        <span v-if="idx < items.length - 1" class="rui-breadcrumb-sep" aria-hidden="true">{{ separator }}</span>
        <span v-if="idx === items.length - 1" class="rui-breadcrumb-current" aria-current="page">{{ item.label }}</span>
    </template>
</nav>
