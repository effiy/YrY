<div class="rui-score-bar" v-if="score">
    <div class="rui-score-grade" :class="'grade-' + (score.grade || 'F').toLowerCase()">{{ score.grade }}</div>
    <div class="rui-score-value">{{ score.value }}</div>
    <div class="rui-score-meta">
        <span class="rui-score-label">{{ label }}</span>
        <span class="rui-score-trend" v-if="score.trend && score.trend !== 'unknown'">· {{ score.trend }}</span>
    </div>
    <div class="rui-score-weights" v-if="(score.weights || []).length">
        <div v-for="w in score.weights" :key="w.dimension" class="rui-progress-bar" role="progressbar" :aria-valuenow="w.score || 0" :aria-valuemin="0" :aria-valuemax="100" :aria-label="w.dimension" :style="{ '--rui-progress': (w.score || 0) + '%' }">
            <span class="rui-progress-bar-label">{{ w.dimension }}</span>
            <span class="rui-progress-bar-track">
                <span class="rui-progress-bar-fill"></span>
            </span>
            <span class="rui-progress-bar-value">{{ w.score }}</span>
        </div>
    </div>
    <div class="rui-score-alerts" v-if="alerts && showAlerts">
        <span class="rui-badge rui-badge--md fail">P0 {{ alerts.p0 || 0 }}</span>
        <span class="rui-badge rui-badge--md warn">P1 {{ alerts.p1 || 0 }}</span>
        <span class="rui-badge rui-badge--md info">P2 {{ alerts.p2 || 0 }}</span>
    </div>
</div>
