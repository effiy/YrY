<script type="text/x-template" id="yry-progress-bar-tpl">
    <div class="yry-progress-bar" :class="modifier ? 'yry-progress-bar--' + modifier : ''" role="progressbar" :aria-valuenow="value" :aria-valuemin="0" :aria-valuemax="100" :aria-label="label || 'Progress bar'" :style="{ '--yry-progress': value + '%' }">
        <span v-if="label" class="yry-progress-bar-label">{{ label }}</span>
        <span class="yry-progress-bar-track">
            <span class="yry-progress-bar-fill"></span>
        </span>
        <span v-if="showValue !== false" class="yry-progress-bar-value">{{ value }}</span>
    </div>
</script>

<script src="index.js"></script>
