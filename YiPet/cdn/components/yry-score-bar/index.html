<script type="text/x-template" id="yry-score-bar-tpl">
    <div class="yry-score-bar" v-if="score">
        <div class="yry-score-grade" :class="'grade-' + (score.grade || 'F').toLowerCase()">{{ score.grade }}</div>
        <div class="yry-score-value">{{ score.value }}</div>
        <div class="yry-score-meta">
            <span class="yry-score-label">{{ label }}</span>
            <span class="yry-score-trend" v-if="score.trend && score.trend !== 'unknown'">· {{ score.trend }}</span>
        </div>
        <div class="yry-score-weights" v-if="(score.weights || []).length">
            <div v-for="w in score.weights" :key="w.dimension" class="yry-progress-bar" role="progressbar" :aria-valuenow="w.score || 0" :aria-valuemin="0" :aria-valuemax="100" :aria-label="w.dimension" :style="{ '--yry-progress': (w.score || 0) + '%' }">
                <span class="yry-progress-bar-label">{{ w.dimension }}</span>
                <span class="yry-progress-bar-track">
                    <span class="yry-progress-bar-fill"></span>
                </span>
                <span class="yry-progress-bar-value">{{ w.score }}</span>
            </div>
        </div>
        <div class="yry-score-alerts" v-if="alerts && showAlerts">
            <span class="yry-badge yry-badge--md fail">P0 {{ alerts.p0 || 0 }}</span>
            <span class="yry-badge yry-badge--md warn">P1 {{ alerts.p1 || 0 }}</span>
            <span class="yry-badge yry-badge--md info">P2 {{ alerts.p2 || 0 }}</span>
        </div>
    </div>
</script>

<script src="index.js"></script>
