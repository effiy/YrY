<div class="rui-toast-container" role="region" aria-live="polite" aria-atomic="false">
  <transition-group name="rui-toast-anim" tag="div" class="rui-toast-stack">
    <div
      v-for="item in items"
      :key="item.id"
      :class="['rui-toast', 'is-' + item.type]"
      :role="item.type === 'error' ? 'alert' : 'status'"
      @click="dismiss(item.id)"
    >
      <span class="rui-toast-icon" aria-hidden="true">{{ icons[item.type] || icons.default }}</span>
      <div class="rui-toast-body">
        <div v-if="item.title" class="rui-toast-title">{{ item.title }}</div>
        <div v-if="item.text" class="rui-toast-text">{{ item.text }}</div>
      </div>
      <button
        class="rui-toast-close"
        aria-label="Close notification"
        type="button"
        @click.stop="dismiss(item.id)"
      >×</button>
    </div>
  </transition-group>
</div>
