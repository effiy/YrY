<!-- ═══════════════════════════════════════════════════════════════════════════
   YrY · H5 NewsList — HTML templates for news items and sessions

   All template strings previously inlined in index.js are now defined here.

   Template IDs:
     tpl-news-item          — News article with external link
     tpl-news-item-nolink   — News article without link
     tpl-news-content       — News content block (title, meta, tags, dot)
     tpl-news-session-item  — Session derived from news
     tpl-news-skeleton      — Loading skeleton placeholder
     tpl-news-tag           — Single tag span (repeated per tag)
     tpl-news-tags          — Tag row wrapper
     tpl-news-source        — Source name span
     tpl-news-host          — Host name span
     tpl-news-dot           — Unread dot indicator
     tpl-news-fav-btn       — Favorite toggle button (for news swipe)
     tpl-session-fav-btn    — Favorite toggle button (for session swipe)
   ═══════════════════════════════════════════════════════════════════════════ -->

<!-- ── News Item (with link) ─────────────────────────────────────────────── -->
<template id="tpl-news-item">
  <div class="swipe-item-wrapper">
    <article class="newsItem{readCls}" data-key="{key}">
      <a class="newsItem__link" href="{link}" target="_blank" rel="noopener noreferrer">{content}</a>
    </article>
    <div class="swipe-item__actions">{favBtn}</div>
  </div>
</template>

<!-- ── News Item (no link) ───────────────────────────────────────────────── -->
<template id="tpl-news-item-nolink">
  <div class="swipe-item-wrapper">
    <article class="newsItem{readCls}" data-key="{key}">
      <div class="newsItem__link">{content}</div>
    </article>
    <div class="swipe-item__actions">{favBtn}</div>
  </div>
</template>

<!-- ── News Content Block ────────────────────────────────────────────────── -->
<template id="tpl-news-content">
  <div class="newsItem__main">
    <div class="newsItem__header">{dot}<h3 class="newsItem__title">{title}</h3></div>
    <div class="newsItem__sub">
      <div class="newsItem__meta">{source}{host}</div>
      <span class="newsItem__time">{date}</span>
    </div>{tags}
  </div>
</template>

<!-- ── News Session Item ─────────────────────────────────────────────────── -->
<template id="tpl-news-session-item">
  <div class="swipe-item-wrapper">
    <article class="newsItem newsItem--session{mutedCls}" data-key="{key}" data-news-key="{newsKey}">
      <div class="newsItem__link">
        <div class="item__mid">
          <div class="item__row1">
            <div class="item__title"><span>{title}</span></div>
            <div class="item__meta"></div>
          </div>
          <div class="item__row2">
            <div class="item__preview">{desc}</div>
          </div>
          <div class="item__row2" style="margin-top:6px">
            <div class="item__tags">{tagBadges}</div>
            <div class="item__meta"><span class="time">{date}</span></div>
          </div>
        </div>
      </div>
    </article>
    <div class="swipe-item__actions">{favBtn}</div>
  </div>
</template>

<!-- ── Skeleton ──────────────────────────────────────────────────────────── -->
<template id="tpl-news-skeleton">
  <article class="newsItem newsItem--skeleton" aria-hidden="true">
    <div class="newsItem__link"><div class="newsItem__main">
      <div class="newsItem__header"><span class="skeletonDot"></span><span class="skeletonBar is-w-70"></span></div>
      <div class="newsItem__sub newsItem__sub--skeleton">
        <span class="skeletonBar is-w-30"></span>
        <span class="skeletonBar is-w-22 skeletonBar--end"></span></div>
      <div class="newsItem__tags newsItem__tags--skeleton">
        <span class="skeletonBar is-w-18"></span>
        <span class="skeletonBar is-w-18"></span>
        <span class="skeletonBar is-w-18"></span></div>
    </div></div>
  </article>
</template>

<!-- ── Partials ──────────────────────────────────────────────────────────── -->
<template id="tpl-news-tag">
  <span class="newsItem__tag">{text}</span>
</template>

<template id="tpl-news-tags">
  <div class="newsItem__tags">{items}</div>
</template>

<template id="tpl-news-source">
  <span class="newsItem__source">{text}</span>
</template>

<template id="tpl-news-host">
  <span class="newsItem__host">{text}</span>
</template>

<template id="tpl-news-dot">
  <span class="newsItem__dot" aria-hidden="true"></span>
</template>

<template id="tpl-news-fav-btn">
  <button class="swipe-item__favorite{favCls}" data-action="toggleNewsFavorite" data-key="{key}" aria-label="{label}">{icon}</button>
</template>

<template id="tpl-session-fav-btn">
  <button class="swipe-item__favorite{favCls}" data-action="toggleFavorite" data-key="{key}" aria-label="{label}">{icon}</button>
</template>
