<!-- ═══════════════════════════════════════════════════════════════════════════
   YrY · H5 Preview — HTML template for image preview overlay

   Template used by Preview/index.js createImagePreviewOverlay().
   Injected once into document.body at init time.

   Structure:
     .imgPreviewOverlay
       ├── .imgPreviewOverlay__backdrop      (click-to-close backdrop)
       ├── .imgPreviewOverlay__topbar         (count + close button)
       ├── .imgPreviewOverlay__content        (prev btn + img + next btn)
       ├── .imgPreviewOverlay__hint           ("点击空白处关闭")
       ├── .imgPreviewToast                   (save confirmation toast)
       └── .imgPreviewActions                 (save/cancel action panel)

   SVG icons reference the sprite-svg definitions (icon-back, icon-next, icon-close).
   ═══════════════════════════════════════════════════════════════════════════ -->

<template id="tpl-img-preview-overlay">
  <div id="imgPreviewOverlay" class="imgPreviewOverlay" hidden aria-hidden="true">
    <div class="imgPreviewOverlay__backdrop" data-action="closeImgPreview"></div>
    <div class="imgPreviewOverlay__topbar">
      <div class="imgPreviewOverlay__count" id="imgPreviewCount" hidden></div>
      <button type="button" class="imgPreviewOverlay__close"
              data-action="closeImgPreview" aria-label="关闭预览" title="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="#icon-close" />
        </svg>
      </button>
    </div>
    <div class="imgPreviewOverlay__content">
      <button type="button" class="imgPreviewNav imgPreviewNav--prev"
              id="imgPreviewPrevBtn" data-action="imgPreviewPrev"
              aria-label="上一张" title="上一张" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="#icon-back" />
        </svg>
      </button>
      <img id="imgPreviewImg" class="imgPreviewOverlay__img" alt="预览图片" />
      <button type="button" class="imgPreviewNav imgPreviewNav--next"
              id="imgPreviewNextBtn" data-action="imgPreviewNext"
              aria-label="下一张" title="下一张" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="#icon-next" />
        </svg>
      </button>
    </div>
    <div class="imgPreviewOverlay__hint">
      <div class="imgPreviewOverlay__hintText">点击空白处关闭</div>
    </div>
    <div class="imgPreviewToast" id="imgPreviewToast" aria-hidden="true">
      <div class="imgPreviewToast__text" id="imgPreviewToastText"> </div>
    </div>
    <div class="imgPreviewActions" id="imgPreviewActions" hidden>
      <div class="imgPreviewActions__panel">
        <button type="button" class="imgPreviewActions__btn is-primary"
                data-action="saveImgPreview">
          保存图片
        </button>
        <button type="button" class="imgPreviewActions__btn is-cancel"
                data-action="closeImgPreviewActions">
          取消
        </button>
      </div>
    </div>
  </div>
</template>
