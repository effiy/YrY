<template id="yi-pet-image-preview-template">
  <div class="image-preview-modal">
    <div class="image-preview-title-bar js-image-preview-title"></div>
    <div class="image-preview-container">
      <div class="image-preview-loading"></div>
      <img class="js-image-preview-img" alt="图片预览" />
    </div>
    <div class="image-preview-button-container">
      <button class="image-preview-download-btn js-image-preview-download" title="下载文件">⬇️</button>
      <button class="image-preview-close-btn js-image-preview-close">✕</button>
    </div>
  </div>
</template>
