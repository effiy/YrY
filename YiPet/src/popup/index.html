<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gentle Companion</title>
    <!--
      Styles — loaded in cascade order:
        index.css                shared layout, keyframes, a11y
        AppHeader/AppHeader.css     AppHeader component
        SettingsCard/SettingsCard.css  SettingsCard component
        SwitchRow/SwitchRow.css     SwitchRow component
        SliderRow/SliderRow.css     SliderRow component
        SelectRow/SelectRow.css     SelectRow component
        Notification/Notification.css  Notification component
        AppFooter/AppFooter.css     AppFooter component
    -->
    <link rel="stylesheet" href="./index.css" />
    
    <link rel="stylesheet" href="./components/AppHeader/AppHeader.css" />
    <link rel="stylesheet" href="./components/SettingsCard/SettingsCard.css" />
    <link rel="stylesheet" href="./components/SwitchRow/SwitchRow.css" />
    <link rel="stylesheet" href="./components/SliderRow/SliderRow.css" />
    <link rel="stylesheet" href="./components/SelectRow/SelectRow.css" />
    <link rel="stylesheet" href="./components/Notification/Notification.css" />
    <link rel="stylesheet" href="./components/AppFooter/AppFooter.css" />
  </head>
  <body>
    <div id="app"></div>

    <!--
      Loading order (dependency-driven):
        1. Vendor       — React
        2. Lib + Config — UrlBuilder → PET_CONFIG → data adapter
        3. Services     — notify, chrome, connect
        4. Components   — ui/* (presentational)
        5. Bootstrap    — Popup container + mount
    -->
    <script src="/cdn/vendor/react@15.6.1/react.min.js"></script>
    <script src="/cdn/vendor/react@15.6.1/react-dom.min.js"></script>
    <script src="/cdn/utils/url.js"></script>
    <script src="../config/pet.defaults.js"></script>
    <script src="../config/pet.config.js"></script>
    <script src="./data.js"></script>
    <script src="./services/notify.js"></script>
    <script src="./services/chrome.js"></script>
    <script src="./services/connect.js"></script>
    <script src="./components/AppHeader/AppHeader.js"></script>
    <script src="./components/SettingsCard/SettingsCard.js"></script>
    <script src="./components/SwitchRow/SwitchRow.js"></script>
    <script src="./components/SliderRow/SliderRow.js"></script>
    <script src="./components/SelectRow/SelectRow.js"></script>
    <script src="./components/Notification/Notification.js"></script>
    <script src="./components/AppFooter/AppFooter.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
