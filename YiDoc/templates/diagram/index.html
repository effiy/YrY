<!--
  @template: architecture-diagram (entry point)
  @purpose: Self-contained dark-themed HTML+SVG architecture diagram.
            Splits the page into 4 files for clarity:
              data.js  — static content (meta + SVG + section arrays)
              index.js — Vue 3 app, composables, runtime template
              index.css — layered CSS (reset → tokens → components → ...)
              index.html — THIS FILE (DOM skeleton + script wiring)

  @command: /yry-report-diagram create
  @style:   Dark, monospaced, inline SVG, built-in PNG/PDF/clipboard export
  @sections:
    - Header: title + pulsing dot + subtitle + export toolbar
    - Main SVG diagram (rounded card, painted in document order below)
    - Summary cards (exactly 3, 3-column grid)
    - Footer (metadata)
  @design_system: ./../references/design-system.md
-->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta
            name="description"
            content="Production architecture diagram for a cloud-native microservices platform on AWS. Covers CDN, WAF, API Gateway, Go microservices, PostgreSQL RDS, Redis, Kafka, CI/CD pipeline, observability stack, security posture, and scaling policies."
        />
        <meta name="color-scheme" content="dark" />
        <!-- Inline empty favicon — keeps the browser from issuing a /favicon.ico
       request that would otherwise show up as a 404 in the console. -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23020617'/%3E%3Cpath d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%2322d3ee' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
        />
        <title>Microservices Platform Architecture Diagram</title>

        <!--
    ═══════════════════════════════════════════════════════════════════
    INFRASTRUCTURE (Vue 3 + offline-safe vendor libs)
    ═══════════════════════════════════════════════════════════════════
    Vue 3 is loaded from YiPet/cdn self-hosted copy, with unpkg
    fallback. The diagram renders offline as long as the repo is
    available (no public CDN dependency).

    DEPLOYMENT DEPTH: The `../../../YiPet/cdn/...` paths assume the
    diagram is deployed at depth 3 from the repo root (e.g.
    `YiDoc/arch-diagram/index.html`). If deployed elsewhere, adjust
    the `../` count accordingly, or switch to the runtime
    directory-tree probe pattern used by `test/templates/index.html`.
  -->
        <script src="../../../YiPet/cdn/vendor/vue.global.prod.js"></script>
        <script>
            if (typeof Vue === "undefined") {
                var s = document.createElement("script");
                s.src = "https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js";
                document.head.appendChild(s);
            }
        </script>

        <!-- Offline-safe vendor copies of html2canvas + jsPDF -->
        <script src="../../../YiPet/cdn/vendor/html2canvas@1.4.1/html2canvas.min.js"></script>
        <script src="../../../YiPet/cdn/vendor/jspdf@2.5.2/jspdf.umd.min.js"></script>

        <!--
    Shared Vue 3 component from the YiPet/cdn:
      yry-back-top — floating scroll-to-top button
    (yry-toast is referenced defensively in index.js but no shared
    copy exists yet; the app mounts without it.)
  -->
        <script src="../../../YiPet/cdn/utils/yidoc/back-top.js"></script>

        <!--
    Page resources (must be loaded in this order: data first, then app).
    data.js   → defines window.REPORT_DATA
    index.css → all styles
    index.js  → Vue app + composables + template
  -->
        <link rel="stylesheet" href="index.css" />
        <script src="../../../YiPet/cdn/components/diagram/primitives.js"></script>
        <script>
            ;(function () {
                'use strict';
                var instances = [];
                function _isIgnored(e) {
                    var tag = e.target.tagName;
                    return (
                        e.ctrlKey || e.metaKey || e.altKey ||
                        tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
                        e.target.isContentEditable
                    );
                }
                function _onKeydown(e) {
                    if (_isIgnored(e)) return;
                    for (var i = instances.length - 1; i >= 0; i--) {
                        var inst = instances[i];
                        if (!inst._bindings) continue;
                        for (var j = 0; j < inst._bindings.length; j++) {
                            var b = inst._bindings[j];
                            var matched = false;
                            var key = e.key;
                            if (b.key && b.key === key) {
                                matched = true;
                            } else if (b.keys && b.keys.indexOf(key) !== -1) {
                                matched = true;
                                key = key;
                            }
                            if (matched) {
                                e.preventDefault();
                                var fn = b.handler;
                                var ctx = b.scope || null;
                                if (b.keys) {
                                    fn.call(ctx, e.key);
                                } else {
                                    fn.call(ctx);
                                }
                                return;
                            }
                        }
                    }
                }
                document.addEventListener('keydown', _onKeydown, true);
                window.yryKbd = {
                    register: function (vm, bindings) {
                        this.unregister(vm);
                        vm._yryKbdBindings = bindings;
                        instances.push(vm);
                    },
                    unregister: function (vm) {
                        var idx = instances.indexOf(vm);
                        if (idx !== -1) {
                            instances.splice(idx, 1);
                        }
                        delete vm._yryKbdBindings;
                    },
                    getDescriptions: function () {
                        var result = [];
                        for (var i = 0; i < instances.length; i++) {
                            var bnds = instances[i]._bindings;
                            if (!bnds) continue;
                            for (var j = 0; j < bnds.length; j++) {
                                var b = bnds[j];
                                if (b.desc) {
                                    result.push({
                                        key: b.key || (b.keys ? b.keys.join(' ') : ''),
                                        desc: b.desc
                                    });
                                }
                            }
                        }
                        return result;
                    }
                };
            })();
        </script>
        <script src="data.js"></script>
        <script src="index.js"></script>
    </head>
    <body>
        <!-- Vue app mount point. Template lives in index.js. -->
        <div id="app" v-cloak></div>
    </body>
</html>
