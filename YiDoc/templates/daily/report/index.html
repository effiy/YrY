<!doctype html>
<html lang="zh-CN">
    <!--
  @file: index.html
  @purpose: Unified page shell for the `/daily report` template.
            Copy this file verbatim into `YiDoc/reports/daily/` —
            it does NOT change between dates. The only per-date file
            is `data.js` in the same directory.

  @layout:
    daily/
    ├── template/
    │   ├── index.html   ← THIS file (canonical thin shell)
    │   ├── index.css    ← shared styles (byte-stable)
    │   ├── index.js     ← shared Vue 3 app (byte-stable)
    │   └── README.md
    └── <YYYY-MM-DD>/
        ├── index.html   ← copy of this file (byte-stable across dates)
        └── data.js      ← per-day data (the ONLY varying file)

  @deployment_depth: 3 (assumes `YiDoc/reports/daily/` layout)
-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daily CTO Report</title>
        <meta name="color-scheme" content="light dark" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230369a1'/><path d='M3 12V8h2v4H3zm4-8v8h2V4H7zm4 4v4h2V8h-2z' stroke='%23ffffff' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>"
        />

        <!-- Shared Vue 3 (YiPet/cdn self-hosted · unpkg fallback) -->
        <script src="../../../YiPet/cdn/vendor/vue.global.prod.js"></script>
        <script>
            if (typeof Vue === "undefined") {
                var s = document.createElement("script");
                s.src = "https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js";
                document.head.appendChild(s);
            }
        </script>

        <!-- Day's data (only this file changes per day) -->
        <script src="data.js"></script>

        <!-- Apply title from data -->
        <script>
            document.title =
                (window.REPORT_DATA && window.REPORT_DATA.meta && window.REPORT_DATA.meta.title) || "Daily CTO Report";
        </script>

        <!-- Shared template resources (byte-stable across all dates) -->
        <link rel="stylesheet" href="../../templates/daily/index.css" />
        <script src="../../templates/daily/index.js"></script>
    </head>
    <body>
        <div id="app" v-cloak></div>
    </body>
</html>
