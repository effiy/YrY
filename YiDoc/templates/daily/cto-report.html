<!doctype html>
<html lang="en">
    <!--
  @file: cto-report.html
  @purpose: CTO daily report page — loads per-date data from the project
            and renders using shared templates/daily/index.css + index.js.
            Usage: cto-report.html?project=YiAi&date=2026-07-24
-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CTO Daily Report</title>
        <meta name="color-scheme" content="light" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230369a1'/><path d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%23ffffff' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>"
        />

        <!-- Shared Vue 3 (YiPet/cdn self-hosted · unpkg fallback) -->
        <script src="../../../YiPet/cdn/vendor/vue.global.prod.js"></script>
        <script>
            if (typeof Vue === "undefined") {
                var s = document.createElement("script");
                s.src = "https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js";
                document.head.appendChild(s);
            }
        </script>

        <!-- Dynamic data loading: ?project=NAME&date=YYYY-MM-DD -->
        <script>
            (function () {
                var params = new URLSearchParams(location.search);
                var project = params.get("project") || "YiAi";
                var date = params.get("date");
                window.__YIDOC_PROJECT__ = project;

                if (date) {
                    var s = document.createElement("script");
                    s.src = "../../projects/" + project + "/daily/" + date + ".js";
                    s.onload = function () {
                        var meta = (window.PLAN_DATA && window.PLAN_DATA.meta) || {};
                        document.title = (project || "") + " Daily Report — " + (meta.date || date);
                    };
                    document.head.appendChild(s);
                } else {
                    document.title = project + " Daily Reports";
                }
            })();
        </script>

        <link rel="stylesheet" href="index.css" />
        <script>
            ;(function () {
                'use strict';
                var instances = [];
                function _isIgnored(e) {
                    var tag = e.target.tagName;
                    return (
                        e.ctrlKey || e.metaKey || e.altKey ||
                        tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
                        e.target.isContentEditable
                    );
                }
                function _onKeydown(e) {
                    if (_isIgnored(e)) return;
                    for (var i = instances.length - 1; i >= 0; i--) {
                        var inst = instances[i];
                        if (!inst._bindings) continue;
                        for (var j = 0; j < inst._bindings.length; j++) {
                            var b = inst._bindings[j];
                            var matched = false;
                            var key = e.key;
                            if (b.key && b.key === key) {
                                matched = true;
                            } else if (b.keys && b.keys.indexOf(key) !== -1) {
                                matched = true;
                                key = key;
                            }
                            if (matched) {
                                e.preventDefault();
                                var fn = b.handler;
                                var ctx = b.scope || null;
                                if (b.keys) {
                                    fn.call(ctx, e.key);
                                } else {
                                    fn.call(ctx);
                                }
                                return;
                            }
                        }
                    }
                }
                document.addEventListener('keydown', _onKeydown, true);
                window.yryKbd = {
                    register: function (vm, bindings) {
                        this.unregister(vm);
                        vm._yryKbdBindings = bindings;
                        instances.push(vm);
                    },
                    unregister: function (vm) {
                        var idx = instances.indexOf(vm);
                        if (idx !== -1) {
                            instances.splice(idx, 1);
                        }
                        delete vm._yryKbdBindings;
                    },
                    getDescriptions: function () {
                        var result = [];
                        for (var i = 0; i < instances.length; i++) {
                            var bnds = instances[i]._bindings;
                            if (!bnds) continue;
                            for (var j = 0; j < bnds.length; j++) {
                                var b = bnds[j];
                                if (b.desc) {
                                    result.push({
                                        key: b.key || (b.keys ? b.keys.join(' ') : ''),
                                        desc: b.desc
                                    });
                                }
                            }
                        }
                        return result;
                    }
                };
            })();
        </script>
        <script src="index.js"></script>
    </head>
    <body>
        <div id="app" v-cloak></div>
    </body>
</html>
