<!doctype html>
<html lang="en">
    <!--
  @file: index.html
  @purpose: Unified page shell for the `/daily plan` template.
            All project-specific values (project, date, scope, …) live
            in data.js as window.PLAN_DATA — this file, index.css,
            index.js, and lib/planToMarkdown.js are byte-identical
            across every project / date. To regenerate a plan, overwrite
            data.js only. The <title> is populated at runtime from
            window.PLAN_DATA.meta.{project,date}.

  @four_file_layout: data.js · index.html · index.css · index.js
  @lib_files:         lib/planToMarkdown.js (exposed as window.dailyPlanToMarkdown)
  @shared_dependencies: YiPet/cdn/vendor/vue.global.prod.js (Vue 3, with unpkg fallback)
  @deployment_depth:  3 (assumes `YiDoc/plan/<date>/` layout; adjust `../` count if deployed elsewhere)
-->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Engineering Plan</title>
        <meta
            name="description"
            content="Three-horizon engineering plan (30d / 90d / long-term) with assumptions, decisions, traceability, capacity, risks, team allocation, and review checklist."
        />
        <meta name="color-scheme" content="light" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230369a1'/><path d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%23ffffff' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>"
        />

        <!-- Shared Vue 3 (YiPet/cdn self-hosted · unpkg fallback) -->
        <script src="../../../YiPet/cdn/vendor/vue.global.prod.js"></script>
        <script>
            if (typeof Vue === "undefined") {
                var s = document.createElement("script");
                s.src = "https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js";
                document.head.appendChild(s);
            }
        </script>

        <!--
    Page resources (must be loaded in this order: schema first, then
    styles, then the markdown exporter lib, then the app).
      data.js                → defines window.PLAN_DATA_SCHEMA + window.PLAN_DATA
      index.css              → all styles (layered: reset → tokens → base → sections → utilities)
      lib/planToMarkdown.js  → pure exporter, exposed as window.dailyPlanToMarkdown
      index.js               → Vue 3 app, composables, runtime template (uses the lib)
  -->
        <script>
            ;(function () {
                'use strict';
                var instances = [];
                function _isIgnored(e) {
                    var tag = e.target.tagName;
                    return (
                        e.ctrlKey || e.metaKey || e.altKey ||
                        tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
                        e.target.isContentEditable
                    );
                }
                function _onKeydown(e) {
                    if (_isIgnored(e)) return;
                    for (var i = instances.length - 1; i >= 0; i--) {
                        var inst = instances[i];
                        if (!inst._bindings) continue;
                        for (var j = 0; j < inst._bindings.length; j++) {
                            var b = inst._bindings[j];
                            var matched = false;
                            var key = e.key;
                            if (b.key && b.key === key) {
                                matched = true;
                            } else if (b.keys && b.keys.indexOf(key) !== -1) {
                                matched = true;
                                key = key;
                            }
                            if (matched) {
                                e.preventDefault();
                                var fn = b.handler;
                                var ctx = b.scope || null;
                                if (b.keys) {
                                    fn.call(ctx, e.key);
                                } else {
                                    fn.call(ctx);
                                }
                                return;
                            }
                        }
                    }
                }
                document.addEventListener('keydown', _onKeydown, true);
                window.yryKbd = {
                    register: function (vm, bindings) {
                        this.unregister(vm);
                        vm._yryKbdBindings = bindings;
                        instances.push(vm);
                    },
                    unregister: function (vm) {
                        var idx = instances.indexOf(vm);
                        if (idx !== -1) {
                            instances.splice(idx, 1);
                        }
                        delete vm._yryKbdBindings;
                    },
                    getDescriptions: function () {
                        var result = [];
                        for (var i = 0; i < instances.length; i++) {
                            var bnds = instances[i]._bindings;
                            if (!bnds) continue;
                            for (var j = 0; j < bnds.length; j++) {
                                var b = bnds[j];
                                if (b.desc) {
                                    result.push({
                                        key: b.key || (b.keys ? b.keys.join(' ') : ''),
                                        desc: b.desc
                                    });
                                }
                            }
                        }
                        return result;
                    }
                };
            })();
        </script>
        <script src="data.js"></script>
        <script>
            // Unified template: <title> is read from data.js at runtime so the
            // shell (index.html / index.css / index.js) stays byte-identical
            // across every project / date. Only data.js varies per plan.
            (function () {
                var meta = (window.PLAN_DATA && window.PLAN_DATA.meta) || {};
                var parts = [];
                if (meta.project) parts.push(meta.project);
                parts.push("Engineering Plan");
                if (meta.date) parts.push(meta.date);
                document.title = parts.join(" — ");
            })();
        </script>
        <link rel="stylesheet" href="index.css" />
        <script src="lib/planToMarkdown.js"></script>
        <script src="index.js"></script>
    </head>
    <body>
        <!--
    Vue app mount point. The template lives in index.js (built once via
    String.raw and passed to Vue.createApp). v-cloak hides the body
    until Vue has rendered — the small CSS rule lives in index.css.
  -->
        <div id="app" v-cloak></div>
    </body>
</html>
