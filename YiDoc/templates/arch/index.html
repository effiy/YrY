<!--
  @template: architecture-diagram (entry point) — SHARED TEMPLATE
  @purpose: Self-contained dark-themed HTML+SVG architecture diagram.
            Splits the page into 4 files for clarity:
              data.js  — static content (meta + SVG + section arrays)
              index.js — Vue 3 app, composables, runtime template
              index.css — layered CSS (reset → tokens → components → ...)
              index.html — THIS FILE (DOM skeleton + script wiring)

  @command: /yry-report-diagram create
  @style:   Dark, monospaced, inline SVG, built-in PNG/PDF/clipboard export
  @sections:
    - Header: title + pulsing dot + subtitle + export toolbar
    - Main SVG diagram (rounded card, painted in document order below)
    - Summary cards (exactly 3, 3-column grid)
    - Footer (metadata)
  @design_system: ./../references/design-system.md

  @canonical_source: This file is the byte-stable source of truth.
            Per-project deployments at `YiDoc/projects/<project>/arch/index.html`
            are path-substituted copies (depth-3 → depth-4) of this file.
            Each per-project copy also carries an inline `&lt;style&gt;` override
            (between the `&lt;!-- inline-override-marker --&gt;` comment and
            `&lt;/style&gt;`) for the project-specific print footer. No automated
            sync tool — propagate template changes by manually applying the
            depth-3 → depth-4 path substitution to each project's shell.
-->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="description" content="Architecture diagram." />
        <meta name="color-scheme" content="dark" />
        <!-- Inline empty favicon — keeps the browser from issuing a /favicon.ico
       request that would otherwise show up as a 404 in the console. -->
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23020617'/%3E%3Cpath d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%2322d3ee' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
        />
        <title>Architecture Diagram</title>

        <!--
    ═══════════════════════════════════════════════════════════════════
    INFRASTRUCTURE (Vue 3 + offline-safe vendor libs)
    ═══════════════════════════════════════════════════════════════════
    Vue 3 is loaded from YiPet/cdn self-hosted copy, with unpkg
    fallback. The diagram renders offline as long as the repo is
    available (no public CDN dependency).

    DEPLOYMENT DEPTH: The `../../../YiPet/cdn/...` paths assume this
    template is deployed at depth 3 from the repo root (i.e. at
    `YiDoc/templates/arch/index.html`). Per-project deployments at
    `YiDoc/projects/<project>/arch/index.html` (depth 4) use
    depth-4 paths (`../../../../YiPet/cdn/...`) — maintain by
    manually applying the depth-3 → depth-4 path substitution when
    the template changes.
  -->
        <script src="../../../YiPet/cdn/vendor/vue.global.prod.js"></script>
        <script>
            if (typeof Vue === "undefined") {
                var s = document.createElement("script");
                s.src = "https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js";
                document.head.appendChild(s);
            }
        </script>

        <!-- Offline-safe vendor copies of html2canvas + jsPDF -->
        <script src="../../../YiPet/cdn/vendor/html2canvas@1.4.1/html2canvas.min.js"></script>
        <script src="../../../YiPet/cdn/vendor/jspdf@2.5.2/jspdf.umd.min.js"></script>

        <!--
    Shared Vue 3 component from the YiPet/cdn:
      yry-back-top — floating scroll-to-top button
    (yry-toast is referenced defensively in index.js but no shared
    copy exists yet; the app mounts without it.)
  -->
        <script src="../../../YiPet/cdn/utils/yidoc/back-top.js"></script>

        <!--
    Page resources (must be loaded in this order: data first, then app).
    data.js   → defines window.REPORT_DATA (per-project, not in this template)
    index.css → all styles (self-reference — same dir as this template)
    index.js  → Vue app + composables + template (self-reference)
  -->
        <link rel="stylesheet" href="index.css" />
        <script src="../../../YiPet/cdn/components/diagram/primitives.js"></script>
        <!-- Data — dynamically loaded from project based on ?project= param -->
        <script>
            (function () {
                var params = new URLSearchParams(location.search);
                var project = params.get("project") || "YiAi";
                window.__YIDOC_PROJECT__ = project;
                var s = document.createElement("script");
                s.src = "../../projects/" + project + "/arch/data.js";
                document.head.appendChild(s);
            })();
        </script>
        <script src="index.js"></script>
    </head>
    <body>
        <!-- Vue app mount point. Template lives in index.js. -->

        <style>
            .scenes-link {
                position: fixed;
                top: 12px;
                right: 12px;
                color: #22d3ee;
                font-size: 13px;
                padding: 6px 12px;
                background: rgba(2, 6, 23, 0.8);
                border: 1px solid #22d3ee44;
                border-radius: 6px;
                z-index: 100;
                text-decoration: none;
                font-family: ui-monospace, SFMono-Regular, monospace;
            }
            .scenes-link:hover {
                background: rgba(2, 6, 23, 1);
                border-color: #22d3ee;
            }
        </style>
        <a href="scenes.html" class="scenes-link">Architecture Scenes &rarr;</a>
        <div id="app" v-cloak></div>
    </body>
</html>
