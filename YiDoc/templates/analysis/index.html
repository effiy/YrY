<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230369a1'/></svg>"
        />
        <title>Analysis</title>
        <link rel="stylesheet" href="../../dashboard/index.css" />
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                max-width: 820px;
                margin: 0 auto;
                padding: 2rem 1.5rem;
                color: #1f2937;
                line-height: 1.65;
            }
            h1 {
                font-size: 1.5rem;
                margin-bottom: 0.25rem;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 0.5rem;
            }
            h2 {
                font-size: 1.2rem;
                margin-top: 1.8rem;
                color: #111827;
            }
            h3 {
                font-size: 1.05rem;
                margin-top: 1.5rem;
                color: #1f2937;
            }
            p {
                margin: 0.75rem 0;
            }
            ul,
            ol {
                padding-left: 1.5rem;
            }
            li {
                margin-bottom: 0.35rem;
            }
            code {
                background: #f3f4f6;
                padding: 0.15rem 0.4rem;
                border-radius: 4px;
                font-size: 0.9em;
            }
            pre {
                background: #f8fafc;
                border: 1px solid #e5e7eb;
                border-radius: 6px;
                padding: 1rem;
                overflow-x: auto;
                font-size: 0.875rem;
            }
            pre code {
                background: none;
                padding: 0;
            }
            blockquote {
                border-left: 3px solid #d1d5db;
                margin-left: 0;
                padding: 0.25rem 1rem;
                color: #6b7280;
            }
            table {
                border-collapse: collapse;
                margin: 1rem 0;
                width: 100%;
            }
            th,
            td {
                border: 1px solid #e5e7eb;
                padding: 0.5rem 0.75rem;
                text-align: left;
                font-size: 0.9rem;
            }
            th {
                background: #f9fafb;
                font-weight: 600;
            }
            hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 2rem 0;
            }
            a {
                color: #0369a1;
            }
            .back {
                display: inline-block;
                margin-bottom: 1.5rem;
                color: #6b7280;
                font-size: 0.85rem;
                text-decoration: none;
            }
            .back:hover {
                text-decoration: underline;
            }
            .loading {
                color: #9ca3af;
                font-style: italic;
            }
            .error {
                color: #ef4444;
            }
        </style>
    </head>
    <body>
        <a class="back" href="index.html">&larr; Back to Project</a>
        <div id="content"><p class="loading">Loading analysis…</p></div>
        <script>
            (function () {
                var params = new URLSearchParams(location.search);
                var project = params.get("project") || "YiAi";
                document.querySelector(".back").href = "index.html?project=" + encodeURIComponent(project);
                document.title = project + " \u00b7 Analysis";

                var mdUrl = "../../projects/" + project + "/analysis/index.md";
                var contentEl = document.getElementById("content");

                /* --- Minimal Markdown → HTML converter --- */
                function md2html(text) {
                    var html = text;

                    // Escape HTML
                    html = html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    // Fenced code blocks
                    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
                        var unescaped = code.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
                        return "<pre><code>" + unescaped + "</code></pre>";
                    });

                    // Inline code (after fenced blocks)
                    html = html.replace(/`([^`]+)`/g, function (_, code) {
                        var unescaped = code.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
                        return "<code>" + unescaped + "</code>";
                    });

                    // Headings
                    html = html.replace(/^#### (.+)$/gm, "<h4>$1</h4>");
                    html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
                    html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
                    html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");

                    // Bold & italic
                    html = html.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
                    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
                    html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");

                    // Horizontal rule
                    html = html.replace(/^---$/gm, "<hr>");

                    // Blockquotes
                    html = html.replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>");
                    // Merge adjacent blockquotes
                    html = html.replace(/<\/blockquote>\n<blockquote>/g, "\n");

                    // Unordered lists
                    html = html.replace(/^[\-\*] (.+)$/gm, "<li>$1</li>");
                    html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, "<ul>\n$1</ul>\n");

                    // Ordered lists
                    html = html.replace(/^\d+\. (.+)$/gm, "<li>$1</li>");

                    // Tables (basic)
                    html = html.replace(/^\|(.+)\|$/gm, function (line) {
                        var cells = line.split("|").filter(function (c) {
                            return c.trim() !== "";
                        });
                        if (/^[\s\-:]+$/.test(cells.join("|"))) return ""; // separator row
                        var tag = "td";
                        return (
                            "<tr>" +
                            cells
                                .map(function (c) {
                                    return "<" + tag + ">" + c.trim() + "</" + tag + ">";
                                })
                                .join("") +
                            "</tr>"
                        );
                    });
                    html = html.replace(/((?:<tr>.*<\/tr>\n?)+)/g, "<table>\n$1</table>\n");

                    // Links
                    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

                    // Paragraphs (any remaining double-newline-separated blocks)
                    var paragraphs = html.split(/\n\n+/);
                    html = paragraphs
                        .map(function (p) {
                            p = p.trim();
                            if (!p) return "";
                            if (/^<(h[1-6]|ul|ol|table|pre|blockquote|hr)/.test(p)) return p;
                            return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
                        })
                        .join("\n");

                    return html;
                }

                /* --- Fetch and render --- */
                fetch(mdUrl)
                    .then(function (res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.text();
                    })
                    .then(function (text) {
                        contentEl.innerHTML = md2html(text);
                    })
                    .catch(function (err) {
                        contentEl.innerHTML = '<p class="error">Failed to load analysis: ' + err.message + "</p>";
                    });
            })();
        </script>
    </body>
</html>
