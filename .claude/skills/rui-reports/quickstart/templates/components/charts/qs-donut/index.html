<script type="text/x-template" id="qs-donut-tpl">
  <div class="qs-donut" :style="{ width: size + 'px' }">
    <svg :width="size" :height="size" :viewBox="viewBox" aria-hidden="true">
      <g :transform="rotation">
        <circle class="qs-donut-track" :cx="cx" :cy="cy" :r="radius" :stroke-width="thickness"/>
        <circle v-for="(seg, i) in laid" :key="i"
          class="qs-donut-segment"
          :class="seg.cls"
          :cx="cx" :cy="cy" :r="radius" :stroke-width="thickness"
          :stroke-dasharray="seg.dasharray"
          :stroke-dashoffset="seg.dashoffset"
        />
      </g>
    </svg>
    <div class="qs-donut-center">
      <span class="qs-donut-value">{{ value }}</span>
      <span class="qs-donut-label" v-if="label">{{ label }}</span>
    </div>
  </div>
</script>
