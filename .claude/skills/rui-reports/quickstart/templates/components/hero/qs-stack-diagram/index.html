<script type="text/x-template" id="qs-stack-diagram-tpl">
  <div class="qs-stack">
    <div v-for="layer in data.layers" :key="layer.tier" class="qs-stack-layer">
      <div class="qs-stack-tier">{{ layer.role }}</div>
      <div class="qs-stack-items">
        <span v-for="it in layer.items" :key="it.name"
          :class="['qs-stack-item', 'is-' + (it.token || 'accent').replace('qs-', '')]">
          <span class="qs-stack-item-dot"></span>
          <span>{{ it.name }}</span>
          <span v-if="it.sub" class="qs-stack-item-sub">— {{ it.sub }}</span>
        </span>
      </div>
    </div>
  </div>
</script>
