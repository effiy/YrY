<!DOCTYPE html>
<html lang="en">
<!--
  @file: index.html
  @purpose: Page shell for the `/daily plan` template.
            Loads shared/loader.js (which auto-injects Vue 3 + the
            primary/fallback URL), then data.js (schema + active data),
            index.css (all styles), lib/planToMarkdown.js (the pure
            markdown exporter), and index.js (Vue 3 app + interactivity).

            Open this file directly in a browser to preview the template
            with example data; the /daily plan command reads the same
            four files, substitutes the active data, and writes a final
            self-contained plan file.

  @four_file_layout: data.js · index.html · index.css · index.js
  @lib_files:         lib/planToMarkdown.js (exposed as window.dailyPlanToMarkdown)
  @shared_dependencies: /YiPet/cdn/loader.js (Vue 3 + components)
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT}} — Engineering Plan — {{DATE}}</title>
  <meta name="description" content="Three-horizon engineering plan (30d / 90d / long-term) with assumptions, decisions, traceability, capacity, risks, team allocation, and review checklist.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230369a1'/><path d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%23ffffff' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>">

  <!--
    ═══════════════════════════════════════════════════════════════════
    INFRASTRUCTURE — shared CDN loader auto-injects Vue 3 (primary +
    fallback URL) and dispatches rui-component-* events. The
    `data-namespace` value is exposed as the IIFE variable used by
    console logging.
    ═══════════════════════════════════════════════════════════════════
  -->
  <script src="/YiPet/cdn/loader.js" data-namespace="rui-plan-report"></script>

  <!-- Shared rui-back-top scroll-to-top button (optional, defensive mount) -->
  <script src="/YiPet/cdn/components/rui-back-top/index.js"></script>

  <!--
    Page resources (must be loaded in this order: schema first, then
    styles, then the markdown exporter lib, then the app).
      data.js                → defines window.PLAN_DATA_SCHEMA + window.PLAN_DATA
      index.css              → all styles (layered: reset → tokens → base → sections → utilities)
      lib/planToMarkdown.js  → pure exporter, exposed as window.dailyPlanToMarkdown
      index.js               → Vue 3 app, composables, runtime template (uses the lib)
  -->
  <script src="data.js"></script>
  <link rel="stylesheet" href="index.css">
  <script src="lib/planToMarkdown.js"></script>
  <script src="index.js"></script>
</head>
<body>
  <!--
    Vue app mount point. The template lives in index.js (built once via
    String.raw and passed to Vue.createApp). v-cloak hides the body
    until Vue has rendered — the small CSS rule lives in index.css.
  -->
  <div id="app" v-cloak></div>
</body>
</html>
