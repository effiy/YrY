<!DOCTYPE html>
<html lang="zh-CN">
<!--
  @file: index.html
  @purpose: Page shell for the `/daily report` template.
            Loads shared/loader.js (which auto-injects Vue 3 + the
            primary/fallback URL), then data.js (schema + active data),
            index.css (all styles), and index.js (Vue 3 app + interactivity).

            Open this file directly in a browser to preview the template
            with example data; the /daily report command reads the same
            four files, substitutes the active data, and writes a final
            self-contained report file into a date-folder under the
            output directory.

  @four_file_layout: data.js · index.html · index.css · index.js
  @shared_dependencies: /YiPet/cdn/loader.js (Vue 3 + components)
  @output: <out>/<YYYY-MM-DD>/{index.html, index.js, index.css, data.js}
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{REPORT_TITLE}}</title>
  <meta name="description" content="Daily CTO-perspective report — summary, risk, health, and people across a rolling lookback window. Offline + git-only; no network calls.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230369a1'/><path d='M3 12V8h2v4H3zm4-8v8h2V4H7zm4 4v4h2V8h-2z' stroke='%23ffffff' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>">

  <!--
    ═══════════════════════════════════════════════════════════════════
    INFRASTRUCTURE — shared CDN loader auto-injects Vue 3 (primary +
    fallback URL) and dispatches rui-component-* events. The
    `data-namespace` value is exposed as the IIFE variable used by
    console logging.
    ═══════════════════════════════════════════════════════════════════
  -->
  <script src="/YiPet/cdn/loader.js" data-namespace="rui-daily-report"></script>

  <!-- Shared rui-back-top scroll-to-top button (auto-mounts via shared loader) -->
  <script src="/YiPet/cdn/components/rui-back-top/index.js"></script>

  <!--
    Page resources (must be loaded in this order: schema first, then
    styles, then app).
      data.js   → defines window.REPORT_DATA_SCHEMA + window.REPORT_DATA
      index.css → all styles (layered: reset → tokens → base → layout → components → sections → utilities → responsive → print)
      index.js  → Vue 3 app, composables, runtime template
  -->
  <script src="data.js"></script>
  <link rel="stylesheet" href="index.css">
  <script src="index.js"></script>
</head>
<body>
  <!--
    Vue app mount point. The template lives in index.js (built once via
    String.raw and passed to Vue.createApp). v-cloak hides the body
    until Vue has rendered — the small CSS rule lives in index.css.
  -->
  <div id="app" v-cloak></div>
</body>
</html>
