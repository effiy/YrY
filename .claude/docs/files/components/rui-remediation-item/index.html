<script type="text/x-template" id="rui-remediation-item-tpl">
    <li class="remediation-item" :class="[tone, { 'is-done': done }]">
        <rui-remediation-check
            :checked="done"
            :disabled="done"
            :aria-label="'Mark resolved: ' + (item.file || '') + ' — ' + (item.message || '')"
            @update:checked="onToggle"></rui-remediation-check>
        <div class="remediation-cell">
            <a :href="item.href" class="remediation-link">
                <span class="remediation-marker">{{ item.marker }}</span>
                <span class="remediation-body">
                    <span class="remediation-file">
                        <code>{{ item.file }}</code><span v-if="item.line" class="remediation-line">:{{ item.line }}</span>
                        <rui-copy-button
                            :text="fileRef"
                            :disabled="done"></rui-copy-button>
                    </span>
                    <span class="remediation-message">{{ item.message }}</span>
                    <span class="remediation-category" v-if="item.category">{{ item.category }}</span>
                </span>
            </a>
            <div class="remediation-detail" v-if="hasDetail">
                <div class="remediation-meta">
                    <span v-if="item.metric" class="remediation-chip remediation-chip-metric">{{ item.metric }}</span>
                    <span v-if="item.effort" class="remediation-chip remediation-chip-effort" :class="'effort-' + item.effort">effort · {{ item.effort }}</span>
                    <span v-if="item.scoreUplift" class="remediation-chip remediation-chip-uplift">+{{ item.scoreUplift }} pts</span>
                    <span v-if="item.estimatedHours" class="remediation-chip remediation-chip-eta">ETA ~{{ item.estimatedHours }}h</span>
                    <span v-if="item.blastRadius" class="remediation-chip remediation-chip-blast">blast · {{ item.blastRadius }}</span>
                </div>
                <p v-if="item.impact" class="remediation-impact">{{ item.impact }}</p>
                <p v-if="item.risk" class="remediation-risk">
                    <span class="remediation-risk-icon" aria-hidden="true">⚠</span>
                    <strong>If unfixed:</strong> {{ item.risk }}
                </p>
                <div v-if="item.firstStep" class="remediation-first-step">
                    <span class="remediation-first-step-icon" aria-hidden="true">▶</span>
                    <span class="remediation-first-step-body"><strong>Start here:</strong> {{ item.firstStep }}</span>
                </div>
                <div class="remediation-recs-accept" v-if="hasRecsOrAcceptance">
                    <ol v-if="item.recommendations && item.recommendations.length" class="remediation-recommendations">
                        <li v-for="(rec, i) in item.recommendations" :key="'r' + i">{{ rec }}</li>
                    </ol>
                    <div v-if="item.acceptance && item.acceptance.length" class="remediation-acceptance">
                        <div class="remediation-acceptance-head">Acceptance criteria</div>
                        <ul>
                            <li v-for="(crit, i) in item.acceptance" :key="'a' + i">{{ crit }}</li>
                        </ul>
                    </div>
                </div>
                <div class="remediation-tooling" v-if="item.tooling && item.tooling.length">
                    <span class="remediation-tooling-head">Suggested tooling</span>
                    <ul class="remediation-tooling-list">
                        <li v-for="(t, i) in item.tooling" :key="'t' + i">
                            <code>{{ t.name }}</code><span v-if="t.hint" class="remediation-tooling-hint"> — {{ t.hint }}</span>
                        </li>
                    </ul>
                </div>
                <div class="remediation-prevent" v-if="item.preventiveControls && item.preventiveControls.length">
                    <span class="remediation-prevent-head">Prevent regression</span>
                    <ul>
                        <li v-for="(ctrl, i) in item.preventiveControls" :key="'p' + i">{{ ctrl }}</li>
                    </ul>
                </div>
                <div class="remediation-rollback" v-if="item.rollbackPlan">
                    <span class="remediation-rollback-head">Rollback plan</span>
                    <p>{{ item.rollbackPlan }}</p>
                </div>
            </div>
        </div>
    </li>
</script>
