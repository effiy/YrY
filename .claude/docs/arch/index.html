<!--
  .claude Skills Catalog — Architecture Diagram
  --------------------------------------------------------------------------
  Self-contained dark-themed HTML+SVG diagram. Renders 8 skill groups
  across 4 regions (External Entry, Skills Catalog, Shared Substrate,
  Generated Documentation) plus external stores and a 2-section legend.

  Generated by rui-report-diagram v2.3.0 (Mode: --from-codebase) against
  /Users/ruiyi/YrY/.claude on 2026-07-15. The 4 sources colocate as:
    data.js   → window.REPORT_DATA  (meta + SVG markup + section arrays)
    index.css → layered CSS (reset → tokens → base → layout → components)
    index.js  → Vue 3 app + useSvgInteractions + useExport composables
    index.html → THIS FILE (DOM skeleton + script wiring + inline favicon)

  @sections:
    - Header: title + pulsing dot + subtitle + export toolbar
    - Executive summary (3 colored tiles)
    - Table of contents (pill nav)
    - System health metrics (8 KPIs)
    - Main SVG diagram (architecture)
    - Summary cards (exactly 3, 3-column grid)
    - Deployment pipeline (5-stage rui-init)
    - Technology stack (12 kv pairs)
    - Glossary (8 terms)
    - Footer
  @shared_resources: all from /.claude/shared/... (no public CDN)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Architecture diagram of the .claude skills catalog: 8 skill groups (rui-init, rui-reports, rui-code, rui-tools, rui-test, rui-questions, rui-docs, rui-cto), 27 SKILL.md manifests, 12 shared Vue 3 components, and 4 vendored libraries — generated by rui-report-diagram from a real codebase scan.">
  <meta name="color-scheme" content="dark">
  <!-- Inline empty favicon — keeps the browser from issuing a /favicon.ico
       request that would otherwise show up as a 404 in the console. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23020617'/%3E%3Cpath d='M2 8h2M5 5h1M5 11h1M8 4h3M8 8h3M8 12h3' stroke='%2322d3ee' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>.claude Skills Catalog — Architecture Diagram</title>

  <!--
    Infrastructure (shared CDN loader + Vue 3 + offline-safe vendor libs).
    shared/loader.js auto-resolves Vue 3 from the local shared/vendor
    folder, so the diagram renders offline (no CDN dependency).
  -->
  <script src="/.claude/shared/loader.js" data-namespace="claude-arch-diagram"></script>

  <!-- Offline-safe vendor copies of html2canvas + jsPDF (shared/vendor) -->
  <script src="/.claude/shared/vendor/html2canvas@1.4.1/html2canvas.min.js"></script>
  <script src="/.claude/shared/vendor/jspdf@2.5.2/jspdf.umd.min.js"></script>

  <!-- Shared Vue 3 components from the rui HTML CDN:
       rui-back-top — floating scroll-to-top button
       rui-toast    — toast notification for copy/PNG/PDF feedback -->
  <script src="/.claude/shared/components/rui-back-top/index.js"></script>
  <script src="/.claude/shared/components/rui-toast/index.js"></script>

  <!--
    Page resources (must be loaded in this order: data first, then app).
    data.js   → defines window.REPORT_DATA
    index.css → all styles
    index.js  → Vue app + composables + template
  -->
  <link rel="stylesheet" href="index.css">
  <script src="data.js"></script>
  <script src="index.js"></script>
</head>
<body>
  <!-- Vue app mount point. Template lives in index.js. -->
  <div id="app" v-cloak></div>
</body>
</html>
