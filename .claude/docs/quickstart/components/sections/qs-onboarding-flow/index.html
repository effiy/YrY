<script type="text/x-template" id="qs-onboarding-flow-tpl">
  <div class="qs-fade-up">
    <div class="qs-stepper" v-if="steps.length">
      <span class="qs-stepper-label">Onboarding progress</span>
      <div class="qs-stepper-progress">
        <div class="qs-stepper-fill" :style="{ width: progressPct + '%' }"></div>
      </div>
      <span class="qs-stepper-count">{{ doneSteps.size }} / {{ steps.length }}</span>
      <button v-if="doneSteps.size" class="qs-stepper-reset" @click="reset">reset</button>
    </div>
    <ol class="qs-stagger">
      <li class="qs-step" v-for="(step, i) in steps" :key="i"
        :class="{ 'is-done': doneSteps.has(i) }"
        @click="toggleStep(i)">
        <span class="qs-step-marker">{{ doneSteps.has(i) ? '\u2713' : (i + 1) }}</span>
        <div class="qs-step-body">
          <div class="qs-step-action">
            <span class="qs-step-action-text">{{ step.action }}</span>
          </div>
          <span class="qs-step-outcome" v-if="step.outcome">{{ step.outcome }}</span>
          <pre class="qs-step-command" v-if="step.command" @click.stop="openCommand(step)"><code>{{ step.command }}</code></pre>
          <span class="qs-faq-source" v-if="step.file"><code>{{ step.file }}</code></span>
        </div>
      </li>
    </ol>
  </div>
</script>
