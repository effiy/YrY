<script type="text/x-template" id="qs-modal-tpl">
  <div class="qs-modal-backdrop" @click.self="close" @keydown="onKey" tabindex="-1">
    <div class="qs-modal" role="dialog" aria-modal="true" :aria-label="command.name">
      <header class="qs-modal-head">
        <span class="qs-modal-kind">{{ command.source || 'Command' }}</span>
        <button class="qs-modal-close" @click="close" aria-label="Close">\u2715</button>
      </header>
      <div class="qs-modal-body">
        <h2 class="qs-modal-name">{{ command.name }}</h2>
        <p class="qs-modal-desc" v-if="command.description">{{ command.description }}</p>
        <pre class="qs-modal-cmd" v-if="command.command"><code>{{ command.command }}</code></pre>
        <div class="qs-modal-foot">
          <button class="qs-modal-action is-copy" @click="copy">Copy command</button>
          <span class="qs-modal-hint" v-if="copyHint">{{ copyHint }}</span>
        </div>
      </div>
    </div>
  </div>
</script>
