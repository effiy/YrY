<script type="text/x-template" id="qs-coverage-gaps-tpl">
  <div class="qs-hero-gaps" v-if="gaps && gaps.length">
    <span class="qs-hero-gaps-icon">!</span>
    <p class="qs-hero-gaps-text">
      <strong>Coverage gaps:</strong>
      {{ hint || 'These sections are below 90% — improving them raises the onboarding score.' }}
    </p>
    <div class="qs-hero-gaps-items">
      <span v-for="g in gaps" :key="g.id" class="qs-hero-gaps-item">
        {{ g.label }}
        <span class="qs-hero-gaps-item-num">{{ g.coverage }}%</span>
      </span>
    </div>
  </div>
</script>
