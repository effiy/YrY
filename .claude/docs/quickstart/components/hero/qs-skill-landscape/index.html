<script type="text/x-template" id="qs-skill-landscape-tpl">
  <div class="qs-landscape">
    <div class="qs-landscape-cells">
      <div v-for="g in data.groups" :key="g.id"
        :class="['qs-landscape-cell', 'is-' + g.accent]"
        :style="{ gridColumn: span(g).col, gridRow: span(g).row }">
        <span class="qs-landscape-cell-name">{{ g.name }}</span>
        <span class="qs-landscape-cell-count">
          {{ g.count }}<span class="qs-landscape-cell-suffix">/ {{ data.total }}</span>
        </span>
        <span class="qs-landscape-cell-top">top: {{ g.top }}</span>
        <span class="qs-landscape-cell-blurb">{{ g.blurb }}</span>
      </div>
    </div>
    <div class="qs-landscape-aside">
      <h4>Growth</h4>
      <qs-sparkline :points="data.trend" tone="accent" :width="180" :height="48"></qs-sparkline>
      <p style="font-size: var(--qs-text-xs); color: var(--qs-text-muted); margin-top: 4px;">
        SKILL.md manifests over 10 release checkpoints — 4 → 26.
      </p>
      <h4 style="margin-top: 8px;">Distribution</h4>
      <ul>
        <li v-for="g in data.groups" :key="g.id" :class="'is-' + g.accent">
          <span>{{ g.name }}</span>
          <span style="margin-left: auto; font-variant-numeric: tabular-nums;">{{ g.share }}%</span>
        </li>
      </ul>
    </div>
  </div>
</script>
