<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/png"
            href="/icon.png"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <script>
            var Module;
        </script>
        <script>
            // Browser-only stubs for Tauri IPC bridge — no-op when not in a Tauri window.
            // The real Tauri runtime replaces these with the native IPC at window creation.
            if (!window.__TAURI_METADATA__) {
                window.__TAURI_METADATA__ = {
                    __currentWindow: { label: 'main' },
                    __currentWebview: { label: 'main', windowLabel: 'main' },
                    __windows: [{ label: 'main' }],
                    __webviews: [{ label: 'main', windowLabel: 'main' }]
                };
            }
            if (!window.__TAURI_IPC__) {
                window.__TAURI_IPC__ = () => new Promise(() => {});
            }
        </script>
        <title>Pot</title>
    </head>

    <body>
        <div id="root"></div>
        <script
            type="module"
            src="/src/main.jsx"
        ></script>
    </body>
</html>
