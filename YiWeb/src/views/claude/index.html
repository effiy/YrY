<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Claude 管理面板 — 管理远端项目 .claude 配置">
    <meta name="keywords" content="Claude, 配置管理, YiWeb">
    <title>YiWeb | Claude 管理面板</title>
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23020617'/%3E%3Cpath d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%2322d3ee' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
</head>

<body>
    <main id="main-content">
        <div id="app">
            <claude-panel-page
                :loading="loading"
                :error="error"
                :projects="projects"
                :total-projects="totalProjects"
                :total-skills="totalSkills"
                :total-agents="totalAgents"
                :health-summary="healthSummary"
                :selected-project="selectedProject"
                @select-project="viewProject"
                @back="goBack"
            ></claude-panel-page>
        </div>
    </main>

    <section id="global-loading-indicator" class="loading-indicator" role="status" aria-live="polite" aria-label="页面加载中">
        <div class="loading-content">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p class="loading-text">正在加载...</p>
        </div>
    </section>

    <script type="module" src="../../../config.js"></script>
    <script type="module" src="../../views/claude/index.js"></script>
</body>

</html>
