<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="故事任务面板 — 查看与搜索故事任务进度，管理文档基线">
    <meta name="keywords" content="故事任务, 面板管理, YiWeb, yry-story">
    <title>YiWeb | 故事任务面板</title>
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23020617'/%3E%3Cpath d='M3 8h2M6 6h1M6 10h1M9 5h2M9 8h2M9 11h2' stroke='%2322d3ee' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
</head>

<body>
    <main id="main-content">
        <div id="app">
            <story-panel-page
                :loading="loading"
                :error="error"
                :stories="stories"
                :selected-story="selectedStory"
                :all-project-tags="allProjectTags"
                :status-counts="statusCounts"
                :total-stories="totalStories"
                :stories-by-status="storiesByStatus"
                :filtered-stories="filteredStories"
                :has-active-filters="hasActiveFilters"
                :document-counts="documentCounts"
                :grouped-stories="groupedStories"
                :project-tags="projectTags"
                :project-tag-counts="projectTagCounts"
                :untagged-count="untaggedCount"
                :tag-color-map="tagColorMap"
                :selected-project-tags="selectedProjectTags"
                :filter-summary-pills="filterSummaryPills"
                :panel-visible="panelVisible"
                :view-modes="viewModes"
                :selected-session-tags="selectedSessionTags"
                :selected-missing-tags="selectedMissingTags"
                :missing-tags="missingTags"
                :story-task-count="storyTaskCount"
                :tag-filter-no-tags="tagFilterNoTags"
                :local-search-query="localSearchQuery"
                :view-mode="viewMode"
                :panel-story="panelStory"
                :sort-field="sortField"
                :sort-direction="sortDirection"
                :story-deps="storyDeps"
                :saving="saving"
                @select-story="viewStory"
                @back="goBack"
                @toggle-session-tag="toggleSessionTag"
                @clear-session-tags="clearSessionTags"
                @toggle-untagged="toggleUntagged"
                @toggle-missing-tag="toggleMissingTag"
                @clear-missing-tags="clearMissingTags"
                @set-search-query="setSearchQuery"
                @clear-search-query="clearSearchQuery"
                @clear-all-filters="clearAllFilters"
                @set-view="setView"
                @toggle-sort="toggleSort"
                @open-detail="openDetail"
                @close-panel="closePanel"
                @handle-tags-scroll="handleTagsScroll"
                @clear-cache="clearCache"
                @update-story="updateStoryDescription"
                @add-dep="addDependency"
                @remove-dep="removeDependency"
            ></story-panel-page>
        </div>
    </main>

    <section id="global-loading-indicator" class="loading-indicator" role="status" aria-live="polite" aria-label="页面加载中">
        <div class="loading-content">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p class="loading-text">正在加载...</p>
        </div>
    </section>

    <noscript>
        <div class="noscript-fallback">
            请启用 JavaScript 以使用故事任务面板
        </div>
    </noscript>

    <script type="module" src="../../../config.js"></script>
    <script type="module" src="../../views/story/index.js"></script>
</body>

</html>
