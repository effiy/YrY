# Server Configuration
server:
  host: "0.0.0.0"
  port: 10086
  reload: true

# Uvicorn Settings
uvicorn:
  limit_concurrency: 1000
  limit_max_requests: 10000
  timeout_keep_alive: 5

# CORS Settings
cors:
  origins:
    - "*"
  allow_any_origin: true

# Pagination Settings
pagination:
  default_size: 2000
  max_size: 100000000
  min_size: 1

# User Settings
default_user:
  id: "default_user"

# Static Files Settings
static:
  base_dir: "../YiKnowledge/static"
  base_url: "https://api.effiy.cn/static"
  max_zip_size_mb: 100

# Project Sources Root (for cross-project file reads via /read-project-file)
# Relative to YiAi's CWD. Default ".." points at the YrY workspace root
# where YiVad/YiPet/YiAi/etc. live as siblings of YiAi.
projects:
  root: ".."

# Knowledge Base Settings
knowledge:
  base_dir: "../YiKnowledge"
  watcher_enabled: true
  watcher_poll_seconds: 60

# Menu Settings — scans YiVad src/views to auto-generate the sidebar menu
menu:
  views_base_dir: "../YiVad/src/views"

# MongoDB Configuration
mongodb:
  url: "mongodb://localhost:27017"
  db_name: "ruiyi"
  pool_size: 10
  max_pool_size: 50

# Database Collections
collection:
  sessions: "sessions"
  rss: "rss"
  chat_records: "chat_records"
  pet_data_sync: "pet_data_sync"
  seeds: "seeds"
  oss_file_tags: "oss_file_tags"
  oss_file_info: "oss_file_info"
  static_files: "static_files"
  knowledge_files: "knowledge_files"

# OSS (Object Storage Service) Configuration
oss:
  access_key: ""
  secret_key: ""
  endpoint: ""
  bucket: ""
  domain: ""
  max_file_size_mb: 50
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".epub"
    - ".md"

# RSS Scheduler Configuration
rss:
  scheduler_enabled: true
  scheduler_interval: 3600

# Startup Tasks
startup:
  init_database: true
  init_rss_system: true

# Middleware Configuration
middleware:
  auth_enabled: false
  auth_token: "dev-token-change-me"

# JWT Configuration
jwt:
  secret: "yi-ai-jwt-secret-change-in-production"
  expire_minutes: 1440

# Module Execution Settings
module:
  allowlist:
    - "*"

# State Store Configuration
state_store:
  enabled: true
  default_ttl: 0
  query_max_limit: 100000000

# Observer Reliability Configuration
observer:
  enabled: false
  throttle_enabled: false
  throttle_max_requests: 100
  throttle_window_seconds: 60
  throttle_whitelist: ""
  sampler_enabled: true
  sampler_max_size: 1000
  sampler_slow_threshold_ms: 5000.0
  sandbox_enabled: false
  sandbox_fs_allowlist: "/tmp,/var/www/YiKnowledge/static"
  sandbox_network_allowlist: ""
  lazy_start: true
  guard_enabled: true
  guard_max_depth: 3

# Ollama Configuration
ollama:
  url: "http://localhost:11434"
  auth: ""
  chat_timeout: 600

# OpenAI Configuration
openai:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  default_model: "gpt-4o"
  chat_timeout: 120

# Anthropic Configuration
anthropic:
  api_key: ""
  base_url: "https://api.anthropic.com"
  default_model: "claude-sonnet-4-6"
  chat_timeout: 120

# Default AI provider: ollama | openai | anthropic
ai_provider: "ollama"

# RAG (llama_index) Configuration
rag:
  embed_model: "nomic-embed-text"
  llm_model: "qwen3.5:4b"
  persist_dir: "./data/rag_store"
  top_k: 4
  chunk_size: 1024
  chunk_overlap: 80
  auto_rebuild_enabled: true
  auto_rebuild_debounce_seconds: 30
  hybrid_retrieval_enabled: true
  rerank_enabled: false
  inline_citations_enabled: true

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  propagate_uvicorn: false
