# Server Configuration
server:
  host: "0.0.0.0"
  port: 10086
  reload: false

# Uvicorn Settings
uvicorn:
  limit_concurrency: 1000
  limit_max_requests: 10000
  timeout_keep_alive: 5

# CORS Settings
cors:
  origins:
    - "*"
  allow_any_origin: true

# Pagination Settings
pagination:
  default_size: 2000
  max_size: 100000000
  min_size: 1

# User Settings
default_user:
  id: "default_user"

# Static Files Settings
static:
  base_dir: "../YiKnowledge/static"
  base_url: "https://api.effiy.cn/static"
  max_zip_size_mb: 100

# Project Sources Root (for cross-project file reads via /read-project-file)
# Relative to YiAi's CWD. Default ".." points at the YrY workspace root
# where YiVad/YiPet/YiAi/etc. live as siblings of YiAi.
projects:
  root: ".."

# Knowledge Base Settings
knowledge:
  base_dir: "../YiKnowledge"
  watcher_enabled: true
  watcher_poll_seconds: 60

# Menu Settings — scans YiVad src/views to auto-generate the sidebar menu
menu:
  views_base_dir: "../YiVad/src/views"

# MongoDB Configuration
mongodb:
  url: "mongodb://localhost:27017"
  db_name: "ruiyi"
  pool_size: 10
  max_pool_size: 50

# Database Collections
collection:
  sessions: "sessions"
  rss: "rss"
  chat_records: "chat_records"
  pet_data_sync: "pet_data_sync"
  seeds: "seeds"
  oss_file_tags: "oss_file_tags"
  oss_file_info: "oss_file_info"
  static_files: "static_files"
  knowledge_files: "knowledge_files"

# OSS (Object Storage Service) Configuration
oss:
  access_key: ""
  secret_key: ""
  endpoint: ""
  bucket: ""
  domain: ""
  max_file_size_mb: 50
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".epub"
    - ".md"

# RSS Scheduler Configuration
rss:
  scheduler_enabled: true
  scheduler_interval: 3600

# Startup Tasks
startup:
  init_database: true
  init_rss_system: true

# Middleware Configuration
middleware:
  auth_enabled: false
  auth_token: "dev-token-change-me"

# JWT Configuration
jwt:
  secret: "yi-ai-jwt-secret-change-in-production"
  expire_minutes: 1440

# Module Execution Settings
module:
  allowlist:
    - "*"

# State Store Configuration
state_store:
  enabled: true
  default_ttl: 0
  query_max_limit: 100000000

# Observer Reliability Configuration
observer:
  enabled: false
  throttle_enabled: false
  throttle_max_requests: 100
  throttle_window_seconds: 60
  throttle_whitelist: ""
  sampler_enabled: true
  sampler_max_size: 1000
  sampler_slow_threshold_ms: 5000.0
  sandbox_enabled: false
  sandbox_fs_allowlist: "/tmp,/var/www/YiKnowledge/static"
  sandbox_network_allowlist: ""
  lazy_start: true
  guard_enabled: true
  guard_max_depth: 3

# Ollama Configuration
ollama:
  url: "http://localhost:11434"
  auth: ""
  chat_model: "qwen3.5:latest"
  chat_timeout: 600
  num_ctx: 4096          # context window size (tokens)
  num_predict: 2048      # max output tokens
  temperature: 0.3       # lower = more deterministic/factual

# DeepSeek Configuration (OpenAI-compatible API)
deepseek:
  api_key: ""
  base_url: "https://api.deepseek.com/v1"
  default_model: "deepseek-chat"
  chat_timeout: 120

# LLM Provider Router — independent chat / embedding provider selection
# When empty, chat_provider falls back to ai_provider, embed_provider falls back to ollama.
llm:
  chat_provider: ""     # ollama | deepseek
  embed_provider: ""    # ollama | deepseek

# Default AI provider: ollama | deepseek
ai_provider: "ollama"

# RAG (llama_index) Configuration
rag:
  embed_model: "nomic-embed-text"
  llm_model: "qwen3.5:latest"
  hyde_model: "qwen3-coder:latest"     # same fast model for HyDE
  persist_dir: "./data/rag_store"
  top_k: 8
  chunk_size: 1024
  chunk_overlap: 300
  auto_rebuild_enabled: true
  auto_rebuild_debounce_seconds: 30
  hybrid_retrieval_enabled: true
  rerank_enabled: false     # LLMRerank adds ~8 LLM calls per query — enable only when retrieval quality > latency
  inline_citations_enabled: true
  # Sentence window retrieval — parses docs into sentences, embeds each sentence,
  # then expands context around matching sentences at query time. Produces
  # richer context than fixed-size chunking for the same embedding cost.
  sentence_window_enabled: false  # disabled for faster indexing — each sentence is embedded separately
  sentence_window_size: 3    # sentences before/after the match to include
  chat_timeout: 300
  llm_request_timeout: 60
  num_predict: 1024          # max tokens for RAG chat (balanced: speed vs thoroughness)
  temperature: 0.0            # temperature for RAG (factual answers)
  # Context builder — how retrieved chunks and history are assembled into the LLM prompt.
  context_chunks: 6        # number of top retrieved chunks to include
  snippet_chars: 800       # max characters per chunk snippet (faster prompt processing)
  history_msgs: 4          # max history messages to include
  history_chars: 400       # max characters per history message
  hyde_enabled: false      # HyDE — adds latency, enable only when retrieval quality is priority
  num_queries: 1           # QueryFusionRetriever LLM query variants (1=fastest, no LLM calls for variants)
  exclude_dirs: ["rss"]    # skip during index build — add back later via /rag-build
  embed_batch_size: 64    # texts per Ollama /api/embed call — higher = fewer round-trips
  # Query-time embedding control. Set query_embed_enabled=false to skip Ollama
  # /api/embeddings on every /rag-query or /rag-chat and fall back to BM25
  # keyword-only search (no GPU/CPU load at query time). Use /rag-embed-warmup
  # to manually pre-cache embeddings for frequent queries.
  query_embed_enabled: true
  embed_cache_enabled: true
  embed_cache_persist: false  # set true to persist cache across restarts (jsonl in rag_persist_dir)

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  propagate_uvicorn: false

# Audit Configuration
audit:
  enabled: true
  retention_days: 90
  large_field_max_chars: 2000
  collection: "audit_logs"

# Backup Configuration
backup:
  enabled: false
  local_dir: "./backups/mongodb"
  remote_dir: ""
  local_retention_days: 7
  remote_retention_days: 30

# Redis Cache (optional — uses in-memory LRU when not configured)
redis:
  url: ""

# Alert Notification
alert:
  wework_webhook: ""
  # File health alert thresholds
  stale_critical_days: 180      # files older than this → critical stale
  stale_warning_multiplier: 1.0 # multiplier on review_cycle max days for warning
  unmaintained_days: 90         # no review_cycle set + older than this → warning
  metadata_min_fields: ["status", "type", "lifecycle", "review_cycle", "roles", "tags"]
  metadata_warn_missing: 3      # missing >= this many fields → warning
  quality_score_critical: 50    # quality score below this → critical alert
  sla_critical_pct: 50          # SLA compliance below this → critical alert
  critical_open_max: 5          # critical bugs open above this → alert

# Database Migrations
migrations:
  dir: "./migrations"
