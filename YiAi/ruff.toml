target-version = "py310"
line-length = 130

[lint]
select = ["F", "E9", "W"]
ignore = [
  "E402",  # sys.path manipulation precedes application imports in app.py
  "E501",  # line length — not a bug
  "F401",  # unused imports handled case-by-case
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
