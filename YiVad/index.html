<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vue.svg" />
    <title><%- title %></title>
  </head>
  <body>
    <div id="app">
      <style>
        html,
        body,
        #app {
          width: 100%;
          height: 100%;
          padding: 0;
          margin: 0;
        }
        .loading-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
        }
        .loading-box .loading-wrap {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 98px;
        }
        .dot {
          position: relative;
          box-sizing: border-box;
          display: inline-block;
          width: 32px;
          height: 32px;
          font-size: 32px;
          transform: rotate(45deg);
          animation: ant-rotate 1.2s infinite linear;
        }
        .dot i {
          position: absolute;
          display: block;
          width: 14px;
          height: 14px;
          background-color: #409eff;
          border-radius: 100%;
          opacity: 0.3;
          transform: scale(0.75);
          transform-origin: 50% 50%;
          animation: ant-spin-move 1s infinite linear alternate;
        }
        .dot i:nth-child(1) {
          top: 0;
          left: 0;
        }
        .dot i:nth-child(2) {
          top: 0;
          right: 0;
          animation-delay: 0.4s;
        }
        .dot i:nth-child(3) {
          right: 0;
          bottom: 0;
          animation-delay: 0.8s;
        }
        .dot i:nth-child(4) {
          bottom: 0;
          left: 0;
          animation-delay: 1.2s;
        }

        @keyframes ant-rotate {
          to {
            transform: rotate(405deg);
          }
        }

        @keyframes ant-spin-move {
          to {
            opacity: 1;
          }
        }
      </style>
      <div class="loading-box">
        <div class="loading-wrap">
          <span class="dot dot-spin"><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var globalState = JSON.parse(window.localStorage.getItem("yivad-global"));
        if (globalState) {
          var dot = document.querySelectorAll(".dot i");
          var html = document.querySelector("html");
          dot.forEach(function(item) { item.style.background = globalState.primary; });

          // Resolve theme: support legacy isDark and new themeMode
          var isDark = false;
          if (globalState.themeMode === 'dark') {
            isDark = true;
          } else if (globalState.themeMode === 'auto') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (globalState.themeMode === 'light') {
            isDark = false;
          } else {
            // Legacy: no themeMode field, fall back to isDark
            isDark = !!globalState.isDark;
          }

          html.setAttribute("data-theme", isDark ? "dark" : "light");
          if (isDark) {
            html.classList.add("dark");
            html.style.background = "#141414";
          }
        }
      })();
    </script>
  </body>
</html>
